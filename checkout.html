<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Checkout</title>
            <!--CSS-->
            <link rel="stylesheet" href="checkoutStyles.css">
           <!--Bootstrap-->
           <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>

    
    
    <header class="header bg-#a7ca56 text-white d-flex align-items-center fixed-top">
        
        <div class="row">
            <h1>Checkout</h1>
        </div>
        
        <!-- margin-spacing 3 -->
        <img src="drinkweblogo.png" height="60px" width="60px" alt="Drink website logo" class="ms-3">
        
        <!-- absolute path. add a "/" in front -->
        <!-- use a bootstrap nav bar. inline.-->
        <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="index.html">Home</a>
            <a class="navbar-brand" href="cart.html">Cart</a>
            <a class="navbar-brand" href="checkout.html" style="color:blue">Checkout</a>
            <a class="navbar-brand" href="deliveryStatus.html">Delivery Status</a>
        </nav>
    </div>
    
</header>  

<body>
    <main>
        
        <form action="deliveryStatus.html">
            
            <div class="center-body"> <!--bg. ADD A MARGIN TOP! MB, DFLEX, ETC..-->
                <!-- Names -->
                <div class="row">
                    <!-- for md, sm, or lg? -->
                    <div class="col-6">
                        <label for="firstName">First Name:</label>
                    </div>
                    <div class="col-6">
                        <label for="lastName">Last Name:</label>
                    </div>
                </div>
                
                
                <div class="row">
                    <div class="col-6">
                        <input type="text" id="firstName" name="firstName" required> 
                    </div>
                    
                    <div class="col-6">
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <br/>
                
                <!-- Delivery Address and Payment -->
                
                <div class="row">
                    <div class="col-6">
                        <label for="text" id="address" name="address">Delivery Address:</label>
                    </div>
                    
                    <div class="col-6">
                        <label for="text" id="payment" name="payment">Payment Details:</label>
                    </div>            
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div class="col-6">
                        <input type="text" value="FREE DRINKS! :D" disabled>
                    </div>
                </div>
                
                <br/>
                
                <div class="row-6">
                        <!-- Once they press checkout button, reset the cart. -->
                        <button type="submit" class="btn btn-success">Checkout!</button>
                        <script>
                            // localStorage.foreach is not a function
                            localStorage.forEach(element => {
                                localStorage.removeItem(element);
                            });
                        </script> 
                </div>
                
                <br/>

                <div class="row-4">
                    <img src="cute-and-funny-little-cat-cartoon-illustration-vector.jpg" height="100px" width="100px"></img>
                </div>
                
                <br/>
                
                
            </div>  <!--bg end tag-->
        </form>
    </main>
</body>

<footer class="page-footer dflex align-items-center">
    <div class="row">
        <p>Images:
            <a href="https://www.vecteezy.com/free-vector/little">Little Vectors by Vecteezy</a>

    </div>

</html>
