<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Checkout</title>
            <!--CSS-->
            <link rel="stylesheet" href="background_styles.css">
            <link rel="stylesheet" href="styles.css">
           <!--Bootstrap-->
           <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>

        <div class="center-background">
            <h1>Please fill out delivery details:</h1>
        </div>



        <div class="center-body">

            <form action="deliveryStatus.html">
                <!-- Names -->
                <div class="row">
                    <div class="col-6">
                        <label for="firstName">First Name:</label>
                    </div>
                    <div class="col-6">
                        <label for="lastName">Last Name:</label>
                    </div>
                </div>
                
                
                <div class="row">
                    <div class="col-6">
                        <input type="text" id="firstName" name="firstName" required> 
                    </div>
                    
                    <div class="col-6">
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <br/>
                
                <!-- Delivery Address and Payment -->
                
                <div class="row">
                    <div class="col-6">
                        <label for="text" id="address" name="address">Delivery Address:</label>
                    </div>
                    
                    <div class="col-6">
                        <label for="text" id="payment" name="payment">Payment Details:</label>
                    </div>            
                </div>
                
                <div class="row">
                    <div class="col-6">
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div class="col-6">
                        <input type="text" value="FREE DRINKS! :D" disabled>
                    </div>
                </div>
                
                <br/>

                <div class="row">
                    <div class="col-4">
                        <img src="cute-and-funny-little-cat-cartoon-illustration-vector.jpg" height="100px" width="100px"></img>
                    </div>
                    <div class="col-8">
                        <button type="submit" class="btn btn-success">Submit</button> 
                    </div>
                </div>
                
                <br>
                
                <div class="main-footer">
                    
                    <p>Image by Vecteezy</p>
                    
                </div>
                
            </form>
        </div>
            
        </body>
        </html>
