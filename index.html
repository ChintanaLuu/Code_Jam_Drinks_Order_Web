<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Drinks Website</title>
      <!--Bootstrap-->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <!--CSS-->
        <link rel="stylesheet" href="indexStyles.css">
        
        <!--Scripts-->
        <script src="CartManager.js"></script>
        <script src="styles.js"></script>
      </head>

        <body>
        <!-- CHANGE THIS TO CALL ONLOAD! -->
        <!-- <script type="module" src="api.js">
          callSpoonacularAPI(); // Access to script blocked CORS policy.
        </script> -->
        
        <!-- i used "header" CSS class here!! it changed to white when added styles.js now for some reason-->
        <header class="header bg-#a7ca56 text-white d-flex align-items-center fixed-top">
          
          <div class="row">
            <h1>Home</h1>
          </div>

          <!-- margin-spacing 3 -->
          <img src="drinkweblogo.png" height="60px" width="60px" alt="Drink website logo" class="ms-3">
          
          <!-- use a bootstrap nav bar. inline.-->
          <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="/index.html" style="color:blue">Home</a>
            <!-- Cart.html is 404 but every other page is available??? And main is too as soon as I click on it from another page!!! -->
            <a class="navbar-brand" href="/Cart.html">Cart</a>
            <a class="navbar-brand" href="/checkout.html">Checkout</a>
            <a class="navbar-brand" href="/deliveryStatus.html">Delivery Status</a>
            </nav>
          </div>
          
        </header>   
          
    <p id="statusID"></p>
          
    <main>
      
      <!-- Use a bootstrap container. -->
  <div class="container cards-wrapper mt-5 pb-5">
    <div class="row gx-4 gy-4" id="cell">
      
      <!--move this into a .js file later.-->
      <script>
        
        //const API_URL= "https://api.spoonacular.com/recipes/complexSearch?apiKey=HIDDEN_API_KEY&type=Drink"
        const API_URL= "https://api.spoonacular.com/recipes/complexSearch?apiKey=eb02b9f4564547709316d45bbd4bc718&type=Drink";

        fetch(API_URL)
        .then(res => {
          if (!res.ok) {
            throw new Error('Network response was not ok'); // Fetch returns nothing due to no wifi connection
          }
          return res.json(); // returns entire OK response converted to json. no network error.
          document.getElementById("statusID").innerHTML = "Please reload and try again. May be a network error.";
          if(!res === 402){
            document.getElementById("statusID").innerHTML = "API credits have ran out for the day. Please try again tomorrow."; 
          }

        })
        
        .then(data => {
          
          // used h-100 to make all cards same height.
          // NEED TO ADJUST ADD TO CART BUTTON TO BE AT SAME Y.POS...
          
          // use bootstrap card and CSS card. Added an onmouseover tag.
          // onmouseover="updateHoverInfo(${drink.id})" onmouseout="updateOutInfo(${drink.id})"
          const results = data.results;
          results.forEach(drink => {
            const drinkHTML = `
            <div class="col-lg-3 col-md-4 col-sm-6 dflex align-items-stretch">
              <div class="card h-100 text-black bg-light">
                <div class="card-body">
                  <img class="card-img-top" src="${drink.image}" alt="${drink.title} height="100px" width="100px"/>
                  <h5 class="card-title">${drink.title}</h5>
                  <p id="drinkInfo-${drink.id}"></p>
                  <button type="button" onclick="addToCart(${drink.id})" class="btn btn-primary" alt="Add item to cart.">Add to cart</button>
                  </div>
                  </div>
                  </div>
                  `;
                  
                  document.querySelector('#cell').insertAdjacentHTML('beforeend', drinkHTML);
                  
                });
              })
              .catch(error => {
                console.error('Error:', error);
              });
              
              </script>
        </div><!--row-->
      </div> <!--container-->
      
    </main>
      
<footer class="page-footer dflex align-items-center">

</html>
