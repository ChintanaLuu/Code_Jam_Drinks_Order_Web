<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Drinks Website</title>
        <!--CSS-->
        <link rel="stylesheet" href="background_styles.css">
        <link rel="stylesheet" href="styles.css">
        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        

        <script src="CartManager.js"></script>
        <script src="api.js"></script>
      </head>
      
      <body class="background-container">
      <!-- <script type="module" src="api.js">
        callSpoonacularAPI(); // Access to script blocked CORS policy.
          console.log('rahh!');
      </script> -->
        <!-- plain bg colour -->
      <div class="left-blue-background"></div>
      
      
      <div class="center-background">
<div class="grid-container" id="cell">

  <script>
    
    //import callSpoonacularAPI() from '/api.js';

    //callSpoonacularAPI();

    //const API_URL= "https://api.spoonacular.com/recipes/complexSearch?apiKey=HIDDEN_API_KEY&type=Drink"
    const API_URL= "https://api.spoonacular.com/recipes/complexSearch?apiKey=eb02b9f4564547709316d45bbd4bc718&type=Drink"

    fetch(API_URL)
    .then(res => {
      if (!res.ok) {
        throw new Error('Network response was not ok'); // Fetch returns nothing due to no wifi connection
      }
      return res.json(); // returns entire OK response converted to json. no network error.
    })
    
    .then(data => {
  
      const results = data.results;
      results.forEach(drink => {
        
        // The cards need padding.
        //need to update grid look later... and also remove cart button href.
        // removed href...
        const drinkHTML = `
        <div class="col">
          <div class="card text-black bg-light" style="width: 18rem;">
            <div class="card-body">
              <img class="card-img-top" src="${drink.image}" alt="${drink.title}" height="100px" width="100px" />
              <h5 class="card-title">${drink.title}</h5>
              <button type="button" onclick="addToCart(${drink.id})" class="btn btn-primary" alt="Add item to cart.">Add to cart</button>
            </div>
          </div>
        </div>
      `;
      
      // The item adds to the cart on THIS page only. It does not transfer over to the cart page...
      // i need to PERSIST my variables. on reload on the SAME page, everything disappears.
      document.querySelector('#cell').insertAdjacentHTML('beforeend', drinkHTML);

            });
          })
          .catch(error => {
            console.error('Error:', error);
    });
          
  </script>


<div class="right-blue-background"></div>
</body>
