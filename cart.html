<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Cart</title>
                <!--CSS-->
        <link rel="stylesheet" href="background_styles.css">
        <link rel="stylesheet" href="styles.css">
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="CartManager.js"></script>
    </head>
    
    <body class="background-container">

        <div class="left-blue-background"></div>

        <div class="center-background">
            <h1>View Cart Items:</h1>
        </div>
        
        <div class ="cart-grid-container" id="cartDisplaygrr">
            
            <!--Place before the script so it exists to be updated.-->
            <div class="row">
                <p id="cartStatusID">Cart is empty right now. Default text.</p>
            </div>

            <script>
                
                var testdefineditem = {id: 756814};
                let rr = {testdefineditem}
                addToCart(rr);
                
            </script>
            
                <!-- <div class="alert" dismiss></div> -->
        </div>
        

        
        <div class="right-blue-background">
            <!-- Display nav bar -->
            <div class="cart-total-bar">
                <img src="trolley.png" height="100px" weight="100px"></img>
                <p>Cart Total: ${totalPrice}</p> 
                <button>
                    <a href="checkout.html" button class="btn btn-green">Checkout</a>
                </button>
            </div>
        </div>

    </body>

</html>
